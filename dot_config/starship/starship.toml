[fill]
symbol = " "

[directory]
truncation_length = 3
truncation_symbol = '|'
truncate_to_repo = false
read_only = " 󰌾"

[aws]
format = '[$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = " "

[azure]
format = '[$symbol($subscription)]($style) '
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
format = '[$symbol($version )]($style)'
symbol = " "

[bun]
format = '[$symbol($version )]($style)'
symbol = " "

[c]
format = '[$symbol($version(-$name) )]($style)'
symbol = " "

[cpp]
format = '[$symbol($version(-$name) )]($style)'
symbol = " "

[cmake]
format = '[$symbol($version )]($style)'
symbol = " "

[cobol]
format = '[$symbol($version )]($style)'
symbol = " "

[cmd_duration]
format = '[$duration]($style) '

[conda]
format = '[$symbol$environment]($style) '
symbol = " "

[container]
symbol = " "

[crystal]
format = '[$symbol($version )]($style)'
symbol = " "

